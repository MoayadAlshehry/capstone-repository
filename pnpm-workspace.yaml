packages:
  - apps/*
  - packages/*
strictPeerDependencies: true
storeDir: .pnpm-store
minimumReleaseAge: 1440
allowBuilds:
  ffmpeg-static@5.3.0: true
  esbuild@0.28.2: true
  esbuild@0.25.12: true
  sharp@0.35.5: true
  '@parcel/watcher@2.6.0': false
  '@swc/core@1.16.13': false
overrides:
  # GHSA-g3hv-75wg-m249: bounded glob preprocessing in the supported Node24 runtime.
  minimatch: 11.0.1
  zod: 4.6.6
  fast-uri: 3.1.9
  # Three confirmed bundled launch-editor advisories; minimum patch only.
  vite: 8.3.3
  '@esbuild-kit/core-utils>esbuild': 0.25.12
patchedDependencies:
  '@radix-ui/react-select@2.3.7': patches/@radix-ui__react-select@2.3.7.patch
  next@16.4.1: patches/next@16.4.1.patch
